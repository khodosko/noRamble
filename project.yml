name: NoRamble

options:
  bundleIdPrefix: com.khodosko
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NoRamble:
    type: application
    platform: iOS
    sources:
      - path: NoRamble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khodosko.NoRamble
        PRODUCT_NAME: NoRamble
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: No Ramble
        INFOPLIST_KEY_NSMicrophoneUsageDescription: No Ramble uses the microphone to record your daily speaking rep.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"

  NoRambleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoRambleTests
    dependencies:
      - target: NoRamble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khodosko.NoRambleTests
        GENERATE_INFOPLIST_FILE: YES

  NoRambleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoRambleUITests
    dependencies:
      - target: NoRamble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khodosko.NoRambleUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoRamble

schemes:
  NoRamble:
    build:
      targets:
        NoRamble: all
        NoRambleTests: [test]
        NoRambleUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: NoRambleTests
        - name: NoRambleUITests
